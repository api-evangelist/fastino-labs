aid: fastino-labs
name: Fastino Labs
description: >-
  Fastino Labs is an applied research lab building production-ready small language models (SLMs)
  for agentic AI — structured data extraction, classification, PII detection, and safety moderation.
  Its Pioneer platform is an agentic fine-tuning and inference API that lets teams generate synthetic
  training data, fine-tune GLiNER encoder models and open-source decoder LLMs (Qwen, Llama, DeepSeek,
  Gemma), evaluate them against labeled datasets, and serve inference through native, OpenAI-compatible,
  and Anthropic-compatible endpoints. Fastino also maintains the open-source GLiNER2 schema-based
  information-extraction model and the GLiGuard safety-moderation model.
